name: Verify licensed purr media
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/acquire_purr.py'
      - '.github/workflows/verify-purr-media.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source validation checks
        run: python scripts/acquire_purr.py --self-test
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - name: Fetch exact licensed source and validate MP3
        run: |
          python scripts/acquire_purr.py --out verified-purr
      # Temporary handoff for the already public CC BY-SA recording only. Never print other files or credentials.
      - name: Handoff exact public MP3 bytes for repository bundling
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'freecat/round-30-recording' }}
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          raw = Path("verified-purr/ariadne.mp3").read_bytes()
          assert len(raw) == 105837, "Unexpected MP3 size"
          assert hashlib.sha256(raw).hexdigest() == "81a70e312dc1166cb22b8558202729cbefdcee5dfd6895badf4c80d13c440ae4", "Unexpected MP3 checksum"
          encoded = base64.b64encode(raw).decode("ascii")
          for i in range(0, len(encoded), 2048):
              print(f"FC_PUBLIC_MP3 {i//2048:04d} {encoded[i:i+2048]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-ariadne-purr
          path: verified-purr/
          if-no-files-found: error
          retention-days: 7
