name: Verify licensed purr media
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/acquire_purr.py'
      - '.github/workflows/verify-purr-media.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source validation checks
        run: python scripts/acquire_purr.py --self-test
      - name: Fetch exact licensed source and validate MP3
        run: |
          ffmpeg -version
          python scripts/acquire_purr.py --out verified-purr
      - uses: actions/upload-artifact@v4
        with:
          name: verified-ariadne-purr
          path: verified-purr/
          if-no-files-found: error
          retention-days: 7
