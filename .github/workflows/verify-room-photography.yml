name: Verify licensed room photography
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/acquire_room_photos.py'
      - 'experiments/full-body/**'
      - '.github/workflows/verify-room-photography.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - run: python scripts/acquire_room_photos.py --self-test
      - run: python scripts/acquire_room_photos.py --out verified-room-photos
      - uses: actions/upload-artifact@v4
        with:
          name: verified-room-photo-candidates
          path: verified-room-photos/
          if-no-files-found: error
          retention-days: 7
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify full-body prototype in both browser engines
        run: |
          cp verified-room-photos/sonkiki.webp experiments/full-body/sonkiki.webp
          FREECAT_BROWSER=chromium python experiments/full-body/check.py
          FREECAT_BROWSER=webkit python experiments/full-body/check.py
