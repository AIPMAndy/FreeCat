name: Verify licensed room photography
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/acquire_room_photos.py'
      - '.github/workflows/verify-room-photography.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - run: python scripts/acquire_room_photos.py --self-test
      - run: python scripts/acquire_room_photos.py --out verified-room-photos
      - uses: actions/upload-artifact@v4
        with:
          name: verified-room-photo-candidates
          path: verified-room-photos/
          if-no-files-found: error
          retention-days: 7
