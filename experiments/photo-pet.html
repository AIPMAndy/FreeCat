<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeCat · Photo Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#342d26;font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px clamp(16px,4vw,48px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px}a{color:inherit;text-underline-offset:4px}h1{font:400 clamp(32px,5vw,58px)/1.1 Georgia,serif;letter-spacing:-.04em;margin:36px 0 8px}p{margin:8px 0;color:#675d50}small{color:#675d50}.stage{position:relative;aspect-ratio:1.8;background:radial-gradient(ellipse at 50% 32%,#f5eddd,#e5dac6);border-radius:26px;margin:24px 0 16px;overflow:hidden;isolation:isolate}.stage:before{content:'';position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(45deg,transparent 0 3px,#a4927a24 3px 4px);pointer-events:none}.stage:after{content:'';position:absolute;inset:62% 12% 9%;background:#6e4a3024;filter:blur(27px);border-radius:50%;z-index:-1}.stage canvas,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:0}.stage img{padding:6% 5%;pointer-events:none}canvas{touch-action:none;cursor:grab}canvas:active{cursor:grabbing}canvas:focus-visible{outline:3px solid #645b37;outline-offset:-5px}button,input{font:inherit}button{border:1px solid #b8aa96;border-radius:30px;padding:10px 18px;background:#fff9;color:#342d26;cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #645b37;outline-offset:4px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.status{min-height:26px}input{max-width:100%}[hidden]{display:none!important}@media(max-width:600px){.stage{aspect-ratio:1.04;margin-top:18px}h1{margin-top:26px}.controls{gap:8px}}
</style>
<main><header><strong>FreeCat / LAB</strong><a href="../index.html">Classic cat / 经典撸猫</a></header><h1>A little moment of calm.</h1><p>轻轻抚摸，慢慢放松。 · Press and stroke gently.</p><div class="stage"><img id="preview" alt="Cat photo / 猫咪照片" hidden><canvas id="cat" tabindex="0" role="button" aria-label="Pet the cat: arrows move, space strokes / 方向键移动，空格抚摸" hidden></canvas></div><p class="status" id="status" role="status">Loading sample / 正在加载素材…</p><div class="controls"><button id="pick">Choose local photo / 选择本地图片</button><input id="file" type="file" accept="image/png,image/webp,image/jpeg" hidden><button id="reset" disabled>Reset / 复位</button></div><p><small>Experimental photo renderer · 图片交互实验。Images stay on this device. No upload. / 不上传图片。</small></p></main>
<script>
'use strict';
const $=id=>document.getElementById(id),cv=$('cat'),preview=$('preview'),status=$('status'),motion=matchMedia('(prefers-reduced-motion: reduce)');
const ctx=cv.getContext('2d',{alpha:true}),patch=document.createElement('canvas'),pc=patch.getContext('2d');
let image=null,mask=null,box=[0,0,1,1],point=[.55,.5],delta=[0,0],target=[0,0],strength=0,pressed=false,raf=0,last=0,visible=true,failed=false,loadId=0,activeId=null;
const say=s=>status.textContent=s;
// Bounded, temporary stroke memory. Coordinates are normalized to the source image.
const TRAIL_LIMIT=5,TRAIL_LIFE=2200;let trail=[];
function remember(p,v,now=performance.now()){
  if(motion.matches||Math.hypot(...v)<.006)return;
  const near=trail.findIndex(m=>Math.hypot(m.p[0]-p[0],m.p[1]-p[1])<.09);
  if(near>=0)trail.splice(near,1);
  trail.push({p:p.slice(),v:v.slice(),time:now});if(trail.length>TRAIL_LIMIT)trail.shift();
}
function paintPatch(p,v,amount,x,y,iw,ih,r){
  if(amount<=.005)return;
  const size=Math.ceil(r*2),px=x+p[0]*iw-r,py=y+p[1]*ih-r;
  if(patch.width!==size||patch.height!==size){patch.width=size;patch.height=size}
  pc.clearRect(0,0,size,size);
  // Sample the original image, not previously distorted output; clip to its original silhouette.
  pc.drawImage(image,x-px+v[0]*iw*amount,y-py+v[1]*ih*amount,iw,ih);
  pc.globalCompositeOperation='destination-in';pc.drawImage(image,x-px,y-py,iw,ih);
  const g=pc.createRadialGradient(r,r,0,r,r,r);g.addColorStop(0,'rgba(0,0,0,0.95)');g.addColorStop(.55,'rgba(0,0,0,0.75)');g.addColorStop(1,'transparent');pc.fillStyle=g;pc.fillRect(0,0,size,size);pc.globalCompositeOperation='source-over';ctx.drawImage(patch,px,py);
}
function fit(){if(!image||failed)return;const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;const d=Math.min(devicePixelRatio||1,1.5,Math.sqrt(1200000/(w*h)));cv.width=Math.max(1,Math.round(w*d));cv.height=Math.max(1,Math.round(h*d));const scale=Math.min(w*.90/image.width,h*.86/image.height),iw=image.width*scale/w,ih=image.height*scale/h;box=[(1-iw)/2,(1-ih)/2,iw,ih];wake()}
function draw(t){raf=0;if(!image||failed||!visible||document.hidden)return;const dt=last?Math.min(50,t-last):16;last=t;const k=1-Math.exp(-dt/85);strength+=(Number(pressed)-strength)*k;for(let i=0;i<2;i++){delta[i]+=(target[i]-delta[i])*k;target[i]*=Math.exp(-dt/135)}const w=cv.width,h=cv.height,x=box[0]*w,y=box[1]*h,iw=box[2]*w,ih=box[3]*h,b=motion.matches?0:Math.sin(t/680)*.009;ctx.clearRect(0,0,w,h);ctx.drawImage(image,x,y-ih*b/2,iw,ih*(1+b));const by=y-ih*b/2,bh=ih*(1+b),r=Math.max(12,Math.min(iw,bh)*.24);trail=motion.matches?[]:trail.filter(m=>t-m.time<TRAIL_LIFE);for(const m of trail){const age=Math.max(0,t-m.time);paintPatch(m.p,m.v,.36*(1-age/TRAIL_LIFE)**2,x,by,iw,bh,r)}paintPatch(point,delta,strength,x,by,iw,bh,r);if(!motion.matches||pressed||strength>.005)wake()}
function wake(){if(!raf&&image&&!failed&&visible&&!document.hidden)raf=requestAnimationFrame(draw)}
function stop(){trail=[];pressed=false;activeId=null;if(raf)cancelAnimationFrame(raf);raf=0;last=0}
function fallback(){failed=true;stop();cv.hidden=true;preview.hidden=!image;$('reset').disabled=true;say(image?'Static preview; use Classic cat for interaction. / 静态预览，请使用经典撸猫。':'Choose a photo / 请选择本地图片。')}
function reset(){trail=[];pressed=false;activeId=null;strength=0;delta=[0,0];target=[0,0];point=[.55,.5];wake()}
function load(src,revoke=false){const id=++loadId,im=new Image();im.onload=()=>{if(id!==loadId){if(revoke)URL.revokeObjectURL(src);return}const c=document.createElement('canvas');const ratio=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));c.width=Math.max(1,Math.round(im.naturalWidth*ratio));c.height=Math.max(1,Math.round(im.naturalHeight*ratio));const ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);image=c;const m=document.createElement('canvas');m.width=256;m.height=Math.max(1,Math.round(256*c.height/c.width));const mc=m.getContext('2d',{willReadFrequently:true});mc.drawImage(c,0,0,m.width,m.height);mask={data:mc.getImageData(0,0,m.width,m.height).data,w:m.width,h:m.height};preview.src=c.toDataURL('image/png');if(revoke)URL.revokeObjectURL(src);if(failed){fallback();return}cv.hidden=false;preview.hidden=true;$('reset').disabled=false;reset();fit();say('Ready to pet / 可以开始抚摸')};im.onerror=()=>{if(revoke)URL.revokeObjectURL(src);if(id===loadId)say(image?'Photo could not load; previous cat kept. / 加载失败，保留原图。':'Sample unavailable. Choose a local photo. / 素材未附带，请选择本地图片。')};im.src=src}
function uv(e){const r=cv.getBoundingClientRect();return [((e.clientX-r.left)/r.width-box[0])/box[2],((e.clientY-r.top)/r.height-box[1])/box[3]]}
function hit(p){if(!mask||p.some(v=>v<0||v>=1))return false;return mask.data[(Math.floor(p[1]*mask.h)*mask.w+Math.floor(p[0]*mask.w))*4+3]>64}
function stroke(p){target=[0,1].map(i=>Math.max(-.065,Math.min(.065,(p[i]-point[i])*1.8)));remember(p,target);point=p;wake()}
cv.addEventListener('pointerdown',e=>{if(activeId!==null||!hit(uv(e)))return;activeId=e.pointerId;point=uv(e);pressed=true;target=[.008,.018];cv.setPointerCapture(e.pointerId);wake()});cv.addEventListener('pointermove',e=>{if(e.pointerId===activeId&&pressed){const p=uv(e);if(hit(p))stroke(p);else{pressed=false;activeId=null;wake()}}});for(const n of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(n,e=>{if(e.pointerId===activeId){pressed=false;activeId=null;wake()}});
cv.addEventListener('keydown',e=>{if(![' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)||activeId!==null)return;e.preventDefault();const step={ArrowLeft:[-.035,0],ArrowRight:[.035,0],ArrowUp:[0,-.035],ArrowDown:[0,.035]}[e.key]||[.012,.012];const p=point.map((v,i)=>Math.max(.05,Math.min(.95,v+step[i])));if(hit(p)){pressed=true;stroke(p)}});cv.addEventListener('keyup',()=>{if(activeId===null){pressed=false;wake()}});cv.addEventListener('blur',()=>{if(activeId===null){pressed=false;wake()}});
$('pick').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(f){if(f.size>16000000||!['image/png','image/webp','image/jpeg'].includes(f.type))say('Choose PNG, WebP or JPEG under 16 MB. / 请选择 16 MB 以内的图片。');else load(URL.createObjectURL(f),true)}e.target.value=''};$('reset').onclick=reset;
cv.addEventListener('contextlost',e=>{e.preventDefault();fallback()});document.addEventListener('visibilitychange',()=>document.hidden?stop():wake());motion.addEventListener('change',wake);new ResizeObserver(fit).observe(cv.parentElement);new IntersectionObserver(es=>{visible=es[0].isIntersecting;visible?wake():stop()}).observe(cv.parentElement);
if(!ctx||!pc)fallback();load('ginger.webp');
</script></html>
