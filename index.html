 guides:[
 {id:'ready',tag:['养猫前','Before adopting'],title:['我适合养猫吗？','Am I ready for a cat?'],steps:[['先确认长期住房允许养猫，家庭成员是否同意，有无过敏或其他宠物冲突。','Check long-term housing permission, household agreement, allergies and compatibility with other pets.'],['安排日常照护、旅行托管、紧急医疗资金；猫需要多年持续照护。','Plan daily care, travel coverage and emergency funds; cats need care for years.'],['先考虑当地救助机构领养，了解个体性格和健康记录，不以稀有外貌为唯一标准。','Consider a local rescue, ask about individual temperament and medical history, and avoid choosing by rarity alone.']]},
 {id:'home',tag:['接猫','New home'],title:['接猫回家的第一周','The first week at home'],steps:[['准备安静安全的单独房间，放置水、食物、干净猫砂盆、躲藏处和抓板；各区域尽量分开。','Prepare a quiet safe room with water, food, a clean litter tray, hiding space and scratching surface; keep resources apart.'],['让猫自主探索，不强抱、不强行见陌生人；其他宠物逐步、隔离地介绍。','Let the cat explore voluntarily; avoid forced handling and introduce other pets gradually with separation.'],['预约兽医检查，带上已知疫苗、驱虫、绝育和芯片记录，由兽医制定后续计划。','Arrange a vet check and bring known vaccination, parasite, neutering and microchip records.']]},
 {id:'food',tag:['日常','Daily care'],title:['吃什么、喝什么','Food and hydration'],steps:[['选择符合所在地营养标准、适合生命阶段的全价猫粮；根据体况与兽医建议调整量。','Choose a complete, life-stage-appropriate cat food under local standards; adjust portions by body condition and veterinary guidance.'],['持续供应干净饮水；可尝试多个水碗或湿粮，观察个体偏好。','Provide fresh water continuously; try multiple bowls or wet food according to the cat’s needs.'],['换粮逐步进行，不喂来历不明的食物、人用药或有毒食物；不要自行配制长期主食。','Change food gradually; avoid unknown foods, human medicines and toxins, and do not improvise a long-term diet.']]},
 {id:'litter',tag:['日常','Daily care'],title:['猫砂盆与清洁','Litter and hygiene'],steps:[['提供足够大小、容易进入、安静放置的猫砂盆；多猫家庭可从每猫一个加一个开始。','Use roomy, accessible trays in quiet locations; in multi-cat homes, one per cat plus one is a useful starting point.'],['每天清理，观察尿量和粪便变化；避免刺激性香味。','Scoop daily and notice urine and stool changes; avoid strong fragrances.'],['突然在盆外排泄应先排查健康、压力与环境，不惩罚猫。','Investigate health, stress and environment if toileting changes suddenly; do not punish the cat.']]},
 {id:'play',tag:['行为','Behavior'],title:['让猫玩得开心','Enrichment and play'],steps:[['每天安排短时互动游戏，用玩具模拟追捕，允许猫抓住玩具。','Offer short interactive play sessions, using toys that mimic prey and allow a successful catch.'],['提供高处、躲藏处、抓板和安全观察窗；封好危险窗缝与阳台。','Provide height, hiding places, scratchers and safe views; secure windows and balconies.'],['尊重身体语言：转头、耳朵后压、甩尾或离开时停止触碰。','Respect body language: stop touching when the cat turns away, flattens ears, lashes its tail or leaves.']]},
 {id:'health',tag:['健康','Health'],title:['疫苗、驱虫、绝育与体检','Preventive veterinary care'],steps:[['按年龄、地区、生活方式与暴露风险，和当地兽医制定疫苗及寄生虫预防计划。','Work with a local vet on vaccination and parasite prevention based on age, location, lifestyle and exposure.'],['讨论合适的绝育时机、芯片登记、口腔护理及定期体检。','Discuss appropriate neutering timing, microchip registration, dental care and regular checkups.'],['记录体重、食欲、饮水、排泄和行为变化，持续异常及时咨询兽医。','Track weight, appetite, drinking, toileting and behavior; contact a vet about persistent changes.']]},

 {id:'multi',tag:['行为','Behavior'],title:['多猫家庭与相处','Living with multiple cats'],steps:[['各自提供食物、水、躲藏点和猫砂盆，减少资源争夺。','Provide separate food, water, hiding areas and litter resources to reduce competition.'],['新猫先隔离、交换气味，再进行短时、可退开的视觉接触。','Start separately, exchange scent, then allow brief visual contact with a retreat option.'],['持续追逐、堵路、躲藏或进食受影响时，降低接触强度并咨询兽医或合格行为专家。','Reduce contact and consult a vet or qualified behavior professional if persistent chasing, blocking, hiding or feeding disruption occurs.']]},

 {id:'urgent',tag:['急症','Emergency'],title:['哪些情况不能等？','When not to wait'],steps:[['呼吸困难、倒地或意识异常、严重外伤、持续抽搐、疑似中毒：立即联系急诊兽医。','Breathing difficulty, collapse or altered consciousness, major trauma, ongoing seizures or suspected poisoning: seek emergency veterinary care immediately.'],['反复尝试排尿但几乎没有尿，尤其是公猫，可能是尿道阻塞，属于急症。','Repeated attempts to urinate with little or no urine, especially in male cats, can signal a urinary obstruction and are an emergency.'],['不要用网络问答替代检查，也不要自行使用人用药。提前保存附近急诊兽医联系方式。','Do not substitute web advice for examination or use human medicines; save local emergency veterinary contacts in advance.']]},
 {id:'travel',tag:['出行','Travel'],title:['外出、搬家与旅行','Travel and moving'],steps:[['使用可靠运输箱，提前通过奖励熟悉箱子，出行时确保箱子固定。','Use a secure carrier, practice positive carrier training, and secure it during travel.'],['旅行前核对目的地、航空公司、当地检疫和证件规则；各国政策不同。','Check destination, carrier and local quarantine and documentation rules before traveling; requirements vary.'],['安排可信照护者、兽医联系方式与书面喂养说明，不把猫单独留在不安全车内。','Arrange a trusted caregiver, veterinary contacts and written care instructions; never leave a cat in an unsafe vehicle.']]},

function care(){hub.innerHTML=head('THE CAT CARE HANDBOOK',L('养猫，从负责任开始。','Good care starts with responsibility.'),L('面向第一次养猫、已有猫咪和不准备养猫的人。','For first-time caregivers, experienced cat people, and those who choose not to adopt.'))+`<div class="hub-alert">${L('急症提示：呼吸困难、倒地、疑似中毒或反复排尿却无尿，应立即联系当地急诊兽医。','Emergency: breathing difficulty, collapse, suspected poisoning or repeated straining with no urine warrant immediate veterinary care.')} ${source(D.sources.emergency,L('急症参考','Emergency reference'))}</div><div class="hub-sections"><section class="hub-card"><h2>${L('从 0 到 1 的养猫指南','Cat care from zero to confident')}</h2>${D.guides.map(g=>`<details class="hub-detail"${g.id==='urgent'?' open':''}><summary><span class="hub-tag">${T(g.tag)} · </span>${T(g.title)}</summary><ol>${g.steps.map(s=>`<li>${T(s)}</li>`).join('')}</ol>${g.id==='urgent'?source(D.sources.urinary,L('尿道阻塞参考','Urinary obstruction reference')):g.id==='safe'?source(D.sources.plants,L('有毒植物数据库','Toxic plant database')):''}</details>`).join('')}</section><div class="hub-list"><section class="hub-card"><h2>${L('领养准备清单','Adoption readiness checklist')}</h2><div class="hub-number" id="readyCount">${st.checks.length} / ${D.readiness.length}</div>${D.readiness.map((item,i)=>`<label class="hub-check"><input type="checkbox" data-check="${i}" ${st.checks.includes(i)?'checked':''}><span>${T(item)}</span></label>`).join('')}<p class="hub-mini">${L('完成清单不代表一定适合领养；仍需评估实际情况。','Completing the checklist does not guarantee readiness; assess your circumstances.')}</p></section><section class="hub-card"><h2>${L('养猫预算规划','Cat care budget planner')}</h2><p class="hub-muted">${L('按你所在地的价格填写。所有金额使用同一货币，不进行汇率换算。','Enter local costs in the same currency. No currency conversion.')}</p><form id="budget" class="hub-form" style="margin-top:14px">${[['setup',L('一次性用品','Initial supplies')],['food',L('每月食物','Monthly food')],['litter',L('每月猫砂','Monthly litter')],['other',L('每月其他','Monthly other')],['vet',L('年度常规医疗','Annual routine vet')],['reserve',L('单独应急储备','Separate emergency reserve')]].map(([k,label])=>`<label class="hub-field"><span>${label}</span><input type="number" name="${k}" min="0" max="1000000000" step="any" value="0" inputmode="decimal"></label>`).join('')}</form><p class="hub-muted" style="margin-top:13px">${L('第一年预计开支（不含储备）','Estimated first-year spending (excluding reserve)')}</p><div class="hub-number" id="budgetTotal">0</div><p class="hub-mini" id="budgetDetail"></p></section></div></div><div class="hub-bottom">${source(D.sources.care,'International Cat Care')}${source(D.sources.vet,'Cornell Feline Health Center')}${source(D.sources.plants,'ASPCA')}<p>${L('仅用于通识教育，不提供诊断、药物剂量或个体治疗建议。具体照护方案请咨询兽医。','General education only, not diagnosis, drug dosing or individualized treatment. Consult a veterinarian.')}</p></div>`;hub.querySelectorAll('[data-check]').forEach(i=>i.onchange=()=>{let n=Number(i.dataset.check);let old=st.checks.slice();st.checks=i.checked?[...new Set([...st.checks,n])]:st.checks.filter(x=>x!==n);if(!save()){st.checks=old;i.checked=old.includes(n);message(L('无法保存本地数据','Local save failed'))}$('readyCount').textContent=`${st.checks.length} / ${D.readiness.length}`});let fmt=n=>n.toLocaleString(undefined,{maximumFractionDigits:2});let calc=()=>{let vals=Object.fromEntries([...new FormData($('budget'))].map(([k,v])=>[k,Math.max(0,Math.min(1e9,Number(v)||0))]));let monthly=vals.food+vals.litter+vals.other,total=vals.setup+monthly*12+vals.vet;$('budgetTotal').textContent=fmt(total);$('budgetDetail').textContent=L(`月均日常 ${fmt(monthly)} · 含应急储备需准备 ${fmt(total+vals.reserve)}`,`Monthly routine ${fmt(monthly)} · Including reserve, plan for ${fmt(total+vals.reserve)}`)};$('budget').oninput=calc;calc()}
function play(){hub.innerHTML=head('THE PLAYROOM',L('今天，和猫咪玩一会儿。','A little playtime, with cats.'),L('没有付费抽卡，没有连续签到压力。认识猫咪本身就是乐趣。','No paid loot boxes or streak pressure. Discovering cats is the fun.'))+`<div class="hub-sections"><section class="hub-card"><div class="hub-spread"><h2>${L('猫咪知识挑战','Cat knowledge quiz')}</h2><span class="hub-badge">${L('最佳','Best')} ${st.best}/${D.quiz.length}</span></div><div id="quizBox"></div></section><section class="hub-card"><h2>${L('随机遇见一只猫','Meet a random cat')}</h2><p class="hub-muted">${L('探索新的猫咪分类，喜欢就收藏。','Discover another cat and save it if you like.')}</p><div id="randomBox"></div><div class="hub-actions">${button(L('遇见下一只','Meet a cat'),'random')}</div></section></div>`;renderQuiz();renderRandom()}
function renderRandom(){let box=$('randomBox');if(!box)return;let b=randomBreed||D.breeds[0];box.innerHTML=breedCard(b)}
function renderQuiz(){let box=$('quizBox');if(!box)return;if(quizDone){box.innerHTML=`<div class="hub-number">${score} / ${D.quiz.length}</div><p>${L('答完啦！每一个正确答案，都能让你更了解猫。','Finished! Every answer helps you understand cats better.')}</p>${button(L('再玩一次','Play again'),'restart')}`;return}let [q,opts,correct,explanation]=D.quiz[quizIdx];box.innerHTML=`<div class="hub-tag">${L('问题','Question')} ${quizIdx+1} / ${D.quiz.length} · ${L('得分','Score')} ${score}</div><h3 style="margin-top:14px">${T(q)}</h3>${opts.map((o,i)=>`<button class="hub-quiz-option ${quizAnswer!==null?(i===correct?'correct':i===quizAnswer?'incorrect':''):''}" type="button" data-action="answer" data-value="${i}" ${quizAnswer!==null?'disabled':''}>${T(o)}</button>`).join('')}${quizAnswer!==null?`<div class="hub-feedback" role="status"><strong>${quizAnswer===correct?L('答对了！','Correct!'):L('又学到一点。','Something new to learn.')}</strong><p>${T(explanation)}</p>${button(quizIdx===D.quiz.length-1?L('查看结果','See results'):L('下一题','Next question'),'next')}</div>`:''}`}
function render(){if(page==='discover')discover();if(page==='identify')identify();if(page==='collection')collection();if(page==='care')care();if(page==='play')play();const pd=document.querySelector('.pet-discovery');if(pd)pd.innerHTML=`<button data-page="discover">${L('认识世界上的猫 →','Explore cats around the world →')}</button><button data-page="care">${L('从 0 到 1 学养猫 →','Learn responsible cat care →')}</button><button data-page="play">${L('来一点猫咪娱乐 →','A little cat fun →')}</button>`}
function fav(id){if(!D.breeds.some(b=>b[0]===id))return;let old=st.favs.slice(),add=!old.includes(id);st.favs=add?[...old,id]:old.filter(x=>x!==id);if(!save()){st.favs=old;message(L('本地保存失败','Local save failed'));return}if(page==='discover')results();else if(page==='collection')collection();else if(page==='play')renderRandom();message(add?L('已收藏','Saved'):L('已取消收藏','Removed'))}
function exportData(){let blob=new Blob([JSON.stringify({schema:'freecat.world.v2',exportedAt:new Date().toISOString(),...st},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='freecat-journal.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const pd=document.createElement('div');pd.className='pet-discovery';$('petPage').after(pd);document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){openPage(b.dataset.page);return}b=e.target.closest('[data-action]');if(!b||b.disabled)return;let v=b.dataset.value;switch(b.dataset.action){case'go':openPage(v);break;case'fav':fav(v);break;case'random':{let candidates=D.breeds.filter(x=>x!==randomBreed);randomBreed=candidates[Math.floor(Math.random()*candidates.length)];renderRandom();break}case'answer':if(quizAnswer===null&&!quizDone){quizAnswer=Number(v);if(quizAnswer===D.quiz[quizIdx][2])score++;renderQuiz()}break;case'next':if(quizAnswer!==null&&!quizDone){if(++quizIdx>=D.quiz.length){quizDone=true;st.best=Math.max(st.best,score);save()}else quizAnswer=null;renderQuiz()}break;case'restart':quizIdx=0;quizAnswer=null;score=0;quizDone=false;play();break;case'export':exportData();break;case'removeCard':if(confirm(L('确定删除这条猫咪记录？','Remove this cat record?'))){let old=st.cards;st.cards=old.filter(c=>c.id!==v);if(!save()){st.cards=old;message(L('删除未保存','Could not save deletion'))}collection()}break}});
$('language').addEventListener('click',()=>{navRender();render()});document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();openPage('pet')});window.addEventListener('hashchange',()=>openPage(location.hash.slice(1)));openPage(location.hash.slice(1),{scroll:false});
})();
</script></body></html>
